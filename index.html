<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Image Converter – Đổi định dạng ảnh</title>
    <meta
      name="description"
      content="Đổi ảnh sang WebP, JPG, PNG ngay trên trình duyệt — ảnh không được tải lên đâu cả."
    />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2'><rect x='3' y='3' width='18' height='18' rx='2'/><circle cx='9' cy='9' r='2'/><path d='m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21'/></svg>" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="top">
        <div>
          <h1 data-i18n="title">Đổi định dạng ảnh</h1>
          <p class="muted" data-i18n="subtitle">Chạy ngay trên trình duyệt — ảnh không được tải lên đâu cả.</p>
        </div>
        <div class="top-actions">
          <button id="lang" class="ghost" type="button" title="English">EN</button>
          <a class="ghost" href="https://github.com/hoangpham2263/image-converter" target="_blank" rel="noopener">GitHub</a>
        </div>
      </header>

      <button id="drop" class="drop" type="button">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 5h6M19 2v6"/><path d="M21 11.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7.5"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/><circle cx="9" cy="9" r="2"/></svg>
        <strong data-i18n="drop">Kéo thả ảnh vào đây hoặc bấm để chọn</strong>
        <span class="muted small" data-i18n="dropHint">Chọn được nhiều ảnh cùng lúc, hoặc dán bằng Ctrl/Cmd + V.</span>
      </button>
      <input id="file" type="file" accept="image/*" multiple hidden />

      <div class="convert">
        <span class="label" data-i18n="to">Đổi sang</span>
        <div class="seg" id="format"></div>
        <span class="label" data-i18n="quality">Chất lượng</span>
        <div class="seg seg-q" id="quality">
          <button type="button" data-q="50"><b data-i18n="q50">Nhẹ nhất</b></button>
          <button type="button" data-q="65"><b data-i18n="q65">Nhẹ</b></button>
          <button type="button" data-q="80" class="active"><b data-i18n="q80">Mặc định</b></button>
          <button type="button" data-q="90"><b data-i18n="q90">Nét</b></button>
          <button type="button" data-q="100"><b data-i18n="q100">Nét nhất</b></button>
        </div>
        <span class="label small" id="qhint" >Cân bằng giữa dung lượng và độ nét (khuyên dùng).</span>
      </div>


      <section id="result" hidden>
        <div class="bar">
          <p id="summary" class="muted"></p>
          <div class="actions">
            <button id="zip" class="primary" type="button" data-i18n="downloadZip">Tải tất cả (ZIP)</button>
            <button id="clear" class="outline" type="button" data-i18n="clear">Xóa hết</button>
          </div>
        </div>
        <ul id="list"></ul>
      </section>

      <footer class="muted small">
        <span data-i18n="footer">Làm bởi</span>
        <a href="https://hoangpham.is-a.dev" target="_blank" rel="noopener">Phạm Quốc Hoàng</a> · MIT
      </footer>
    </main>
    <script src="zip.js"></script>
    <script src="app.js"></script>
  </body>
</html>
